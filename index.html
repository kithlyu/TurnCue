<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurnCue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1f1f1f;
    }

    .app {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 36px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    .tagline {
      font-size: 18px;
      line-height: 1.5;
      color: #555;
      margin-bottom: 32px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #1f1f1f;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #status {
      display: none;
    }

    .position {
      font-size: 64px;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    .ahead {
      font-size: 18px;
      margin-bottom: 28px;
    }

    .message {
      font-size: 17px;
      line-height: 1.5;
      color: #555;
    }

    #errorMessage {
      display: none;
      margin-top: 18px;
      color: #b00020;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="card">

      <div class="logo">🔔</div>

      <div id="joinScreen">
        <h1>TurnCue</h1>

        <p class="tagline">
          Don't wait around.<br>
          We'll cue you.
        </p>

        <button id="joinButton">JOIN QUEUE</button>

        <div id="errorMessage">
          Something went wrong. Please try again.
        </div>
      </div>

      <div id="status">
        <h1>You're in!</h1>

        <div class="position" id="position"></div>

        <div class="ahead" id="ahead"></div>

        <div class="message">
          You can walk away.<br>
          We'll cue you when you're close.
        </div>
      </div>

    </div>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      query,
      where,
      orderBy,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCngq4CXYVHXBqr_zipMgIqPiDWxzlpIVM",
      authDomain: "turncue-83e1a.firebaseapp.com",
      projectId: "turncue-83e1a",
      storageBucket: "turncue-83e1a.firebasestorage.app",
      messagingSenderId: "459437201769",
      appId: "1:459437201769:web:1859490f3db0f3fc2945f8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const joinButton = document.getElementById("joinButton");

    joinButton.addEventListener("click", async () => {

      joinButton.disabled = true;
      joinButton.textContent = "JOINING...";

      try {

        const myEntry = await addDoc(collection(db, "queue"), {
          status: "waiting",
          joinedAt: serverTimestamp()
        });

        const queueQuery = query(
          collection(db, "queue"),
          where("status", "==", "waiting"),
          orderBy("joinedAt", "asc")
        );

        const snapshot = await getDocs(queueQuery);

        let myPosition = 0;

        snapshot.docs.forEach((doc, index) => {
          if (doc.id === myEntry.id) {
            myPosition = index + 1;
          }
        });

        if (myPosition === 0) {
          throw new Error("Could not determine queue position.");
        }

        document.getElementById("position").textContent =
          "#" + myPosition;

        const peopleAhead = myPosition - 1;

        if (peopleAhead === 0) {
          document.getElementById("ahead").textContent =
            "You're first in line";
        } else if (peopleAhead === 1) {
          document.getElementById("ahead").textContent =
            "1 person ahead of you";
        } else {
          document.getElementById("ahead").textContent =
            peopleAhead + " people ahead of you";
        }

        document.getElementById("joinScreen").style.display = "none";
        document.getElementById("status").style.display = "block";

      } catch (error) {

        console.error("Error joining queue:", error);

        joinButton.disabled = false;
        joinButton.textContent = "JOIN QUEUE";

        document.getElementById("errorMessage").style.display = "block";
      }

    });

  </script>

</body>
</html>
