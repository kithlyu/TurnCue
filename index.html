<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TurnCue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1f1f1f;
    }

    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .bell {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    .tagline {
      margin-top: 10px;
      color: #666;
      font-size: 17px;
      line-height: 1.5;
    }

    #joinButton {
      width: 100%;
      margin-top: 30px;
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #1f1f1f;
      color: white;
    }

    #joinButton:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #queueScreen {
      display: none;
    }

    .youre-in {
      font-size: 18px;
      margin-bottom: 8px;
    }

    #position {
      font-size: 72px;
      font-weight: bold;
      margin: 10px 0;
    }

    #ahead {
      font-size: 18px;
      margin-bottom: 24px;
    }

    .walk-away {
      color: #666;
      font-size: 17px;
      line-height: 1.5;
    }

    #calledMessage {
      display: none;
    }

    .called-title {
      font-size: 34px;
      font-weight: bold;
      margin: 18px 0 10px;
    }

    .called-text {
      color: #555;
      font-size: 18px;
      line-height: 1.5;
    }

    .error {
      color: #b00020;
      margin-top: 18px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="card">

      <div id="joinScreen">

        <div class="bell">🔔</div>

        <h1>TurnCue</h1>

        <div class="tagline">
          Don't wait around.<br>
          We'll cue you.
        </div>

        <button id="joinButton">
          JOIN QUEUE
        </button>

        <div id="errorMessage" class="error"></div>

      </div>


      <div id="queueScreen">

        <div id="waitingMessage">

          <div class="bell">🔔</div>

          <div class="youre-in">
            You're in!
          </div>

          <div id="position">
            #1
          </div>

          <div id="ahead">
            You're first in line.
          </div>

          <div class="walk-away">
            You can walk away.<br>
            We'll keep your place.
          </div>

        </div>


        <div id="calledMessage">

          <div class="bell">🔔</div>

          <div class="called-title">
            It's your turn!
          </div>

          <div class="called-text">
            Please return now.
          </div>

        </div>

      </div>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      query,
      where,
      orderBy,
      onSnapshot,
      doc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCngq4CXYVHXBqr_zipMgIqPiDWxzlpIVM",
      authDomain: "turncue-83e1a.firebaseapp.com",
      projectId: "turncue-83e1a",
      storageBucket: "turncue-83e1a.firebasestorage.app",
      messagingSenderId: "459437201769",
      appId: "1:459437201769:web:1859490f3db0f3fc2945f8"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    const joinButton =
      document.getElementById("joinButton");

    const joinScreen =
      document.getElementById("joinScreen");

    const queueScreen =
      document.getElementById("queueScreen");

    const waitingMessage =
      document.getElementById("waitingMessage");

    const calledMessage =
      document.getElementById("calledMessage");

    const position =
      document.getElementById("position");

    const ahead =
      document.getElementById("ahead");

    const errorMessage =
      document.getElementById("errorMessage");


    let myDocumentId = null;


    joinButton.addEventListener("click", async () => {

      joinButton.disabled = true;
      joinButton.textContent = "JOINING...";
      errorMessage.textContent = "";

      try {

        const myDocument = await addDoc(
          collection(db, "queue"),
          {
            status: "waiting",
            joinedAt: serverTimestamp()
          }
        );

        myDocumentId = myDocument.id;

        joinScreen.style.display = "none";
        queueScreen.style.display = "block";

        startQueueListener();
        startStatusListener();

      } catch (error) {

        console.error("Join queue error:", error);

        errorMessage.textContent =
          "Something went wrong. Please try again.";

        joinButton.disabled = false;
        joinButton.textContent = "JOIN QUEUE";
      }

    });


    function startQueueListener() {

      const queueQuery = query(
        collection(db, "queue"),
        where("status", "==", "waiting"),
        orderBy("joinedAt", "asc")
      );


      onSnapshot(

        queueQuery,

        (snapshot) => {

          if (!myDocumentId) {
            return;
          }

          const myIndex =
            snapshot.docs.findIndex(
              customer => customer.id === myDocumentId
            );


          if (myIndex === -1) {
            return;
          }


          const myPosition = myIndex + 1;

          position.textContent =
            "#" + myPosition;


          if (myPosition === 1) {

            ahead.textContent =
              "You're first in line.";

          } else if (myPosition === 2) {

            ahead.textContent =
              "1 person ahead of you.";

          } else {

            ahead.textContent =
              (myPosition - 1) +
              " people ahead of you.";

          }

        },

        (error) => {
          console.error(
            "Queue listener error:",
            error
          );
        }

      );

    }


    function startStatusListener() {

      const myDoc =
        doc(db, "queue", myDocumentId);


      onSnapshot(

        myDoc,

        (snapshot) => {

          if (!snapshot.exists()) {
            return;
          }


          const data = snapshot.data();


          if (data.status === "called") {

            waitingMessage.style.display =
              "none";

            calledMessage.style.display =
              "block";

          }

        },

        (error) => {
          console.error(
            "Status listener error:",
            error
          );
        }

      );

    }

  </script>

</body>
</html>
