<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurnCue Business</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1f1f1f;
    }

    .app {
      min-height: 100vh;
      padding: 40px 24px;
    }

    .dashboard {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 30px;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
    }

    .queue-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .queue-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .queue-title h2 {
      margin: 0;
      font-size: 22px;
    }

    #count {
      color: #666;
      font-size: 15px;
    }

    .queue-item {
      display: flex;
      align-items: center;
      padding: 18px 0;
      border-top: 1px solid #eee;
    }

    .number {
      font-size: 24px;
      font-weight: bold;
      width: 70px;
    }

    .status {
      font-size: 16px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 35px 0;
    }

    .error {
      color: #b00020;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="dashboard">

      <div class="header">
        <div class="logo">🔔</div>
        <h1>TurnCue</h1>
        <div class="subtitle">Business Dashboard</div>
      </div>

      <div class="queue-card">

        <div class="queue-title">
          <h2>Waiting</h2>
          <div id="count">0 waiting</div>
        </div>

        <div id="queueList">
          <div class="empty">No one is waiting.</div>
        </div>

      </div>

    </div>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCngq4CXYVHXBqr_zipMgIqPiDWxzlpIVM",
      authDomain: "turncue-83e1a.firebaseapp.com",
      projectId: "turncue-83e1a",
      storageBucket: "turncue-83e1a.firebasestorage.app",
      messagingSenderId: "459437201769",
      appId: "1:459437201769:web:1859490f3db0f3fc2945f8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const queueQuery = query(
      collection(db, "queue"),
      where("status", "==", "waiting"),
      orderBy("joinedAt", "asc")
    );

    onSnapshot(
      queueQuery,

      (snapshot) => {

        const queueList = document.getElementById("queueList");
        const count = document.getElementById("count");

        queueList.innerHTML = "";

        count.textContent =
          snapshot.size + (snapshot.size === 1 ? " waiting" : " waiting");

        if (snapshot.empty) {
          queueList.innerHTML =
            '<div class="empty">No one is waiting.</div>';
          return;
        }

        snapshot.docs.forEach((doc, index) => {

          const item = document.createElement("div");
          item.className = "queue-item";

          const number = document.createElement("div");
          number.className = "number";
          number.textContent = "#" + (index + 1);

          const status = document.createElement("div");
          status.className = "status";
          status.textContent = "Waiting";

          item.appendChild(number);
          item.appendChild(status);

          queueList.appendChild(item);
        });
      },

      (error) => {
        console.error("Queue listener error:", error);

        document.getElementById("queueList").innerHTML =
          '<div class="error">Unable to load queue.</div>';
      }
    );

  </script>

</body>
</html>
