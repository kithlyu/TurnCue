<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurnCue Business</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1f1f1f;
    }

    .app {
      min-height: 100vh;
      padding: 40px 24px;
    }

    .dashboard {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 30px;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
    }

    .queue-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .queue-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .queue-title h2 {
      margin: 0;
      font-size: 22px;
    }

    .count {
      color: #666;
      font-size: 15px;
    }

    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      border-top: 1px solid #eee;
    }

    .person-info {
      display: flex;
      align-items: center;
    }

    .number {
      font-size: 24px;
      font-weight: bold;
      width: 70px;
    }

    .status {
      font-size: 16px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 35px 0;
    }

    .error {
      color: #b00020;
      padding: 20px 0;
    }

    #callNextButton {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #1f1f1f;
      color: white;
    }

    #callNextButton:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .complete-button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #1f1f1f;
      color: white;
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="dashboard">

      <div class="header">
        <div class="logo">🔔</div>
        <h1>TurnCue</h1>
        <div class="subtitle">Business Dashboard</div>
      </div>

      <div class="queue-card">

        <div class="queue-title">
          <h2>Waiting</h2>
          <div id="waitingCount" class="count">0 waiting</div>
        </div>

        <button id="callNextButton" disabled>
          CALL NEXT
        </button>

        <div id="waitingList">
          <div class="empty">No one is waiting.</div>
        </div>

      </div>

      <div class="queue-card">

        <div class="queue-title">
          <h2>Called</h2>
          <div id="calledCount" class="count">0 called</div>
        </div>

        <div id="calledList">
          <div class="empty">No one has been called.</div>
        </div>

      </div>

    </div>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      orderBy,
      onSnapshot,
      doc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCngq4CXYVHXBqr_zipMgIqPiDWxzlpIVM",
      authDomain: "turncue-83e1a.firebaseapp.com",
      projectId: "turncue-83e1a",
      storageBucket: "turncue-83e1a.firebasestorage.app",
      messagingSenderId: "459437201769",
      appId: "1:459437201769:web:1859490f3db0f3fc2945f8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const waitingList =
      document.getElementById("waitingList");

    const waitingCount =
      document.getElementById("waitingCount");

    const calledList =
      document.getElementById("calledList");

    const calledCount =
      document.getElementById("calledCount");

    const callNextButton =
      document.getElementById("callNextButton");

    let waitingCustomers = [];

    const waitingQuery = query(
      collection(db, "queue"),
      where("status", "==", "waiting"),
      orderBy("joinedAt", "asc")
    );

    const calledQuery = query(
      collection(db, "queue"),
      where("status", "==", "called"),
      orderBy("calledAt", "asc")
    );

    onSnapshot(
      waitingQuery,

      (snapshot) => {

        waitingCustomers = snapshot.docs;

        waitingList.innerHTML = "";

        waitingCount.textContent =
          snapshot.size + " waiting";

        callNextButton.disabled =
          snapshot.empty;

        if (snapshot.empty) {
          waitingList.innerHTML =
            '<div class="empty">No one is waiting.</div>';
          return;
        }

        snapshot.docs.forEach((customer, index) => {

          const item =
            document.createElement("div");

          item.className = "queue-item";

          const personInfo =
            document.createElement("div");

          personInfo.className = "person-info";

          const number =
            document.createElement("div");

          number.className = "number";
          number.textContent = "#" + (index + 1);

          const status =
            document.createElement("div");

          status.className = "status";
          status.textContent = "Waiting";

          personInfo.appendChild(number);
          personInfo.appendChild(status);

          item.appendChild(personInfo);

          waitingList.appendChild(item);
        });

      },

      (error) => {

        console.error(
          "Waiting queue error:",
          error
        );

        waitingList.innerHTML =
          '<div class="error">Unable to load waiting queue.</div>';
      }
    );

    onSnapshot(
      calledQuery,

      (snapshot) => {

        calledList.innerHTML = "";

        calledCount.textContent =
          snapshot.size + " called";

        if (snapshot.empty) {

          calledList.innerHTML =
            '<div class="empty">No one has been called.</div>';

          return;
        }

        snapshot.docs.forEach((customer) => {

          const item =
            document.createElement("div");

          item.className = "queue-item";

          const personInfo =
            document.createElement("div");

          personInfo.className = "person-info";

          const status =
            document.createElement("div");

          status.className = "status";
          status.textContent = "It's their turn";

          const completeButton =
            document.createElement("button");

          completeButton.className =
            "complete-button";

          completeButton.textContent =
            "COMPLETE";

          completeButton.addEventListener(
            "click",
            async () => {

              completeButton.disabled = true;

              try {

                await updateDoc(
                  doc(db, "queue", customer.id),
                  {
                    status: "completed",
                    completedAt: serverTimestamp()
                  }
                );

              } catch (error) {

                console.error(
                  "Complete error:",
                  error
                );

                completeButton.disabled = false;
              }

            }
          );

          personInfo.appendChild(status);

          item.appendChild(personInfo);
          item.appendChild(completeButton);

          calledList.appendChild(item);
        });

      },

      (error) => {

        console.error(
          "Called queue error:",
          error
        );

        calledList.innerHTML =
          '<div class="error">Unable to load called customers.</div>';
      }
    );

    callNextButton.addEventListener(
      "click",
      async () => {

        if (waitingCustomers.length === 0) {
          return;
        }

        callNextButton.disabled = true;

        try {

          const firstCustomer =
            waitingCustomers[0];

          await updateDoc(
            doc(db, "queue", firstCustomer.id),
            {
              status: "called",
              calledAt: serverTimestamp()
            }
          );

        } catch (error) {

          console.error(
            "Call next error:",
            error
          );

          callNextButton.disabled = false;
        }

      }
    );

  </script>

</body>
</html>
