<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurnCue Business</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1f1f1f;
    }

    .app {
      min-height: 100vh;
      padding: 40px 24px;
    }

    .dashboard {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 30px;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
    }

    .session-bar {
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .session-status {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .session-detail {
      color: #666;
      font-size: 14px;
    }

    .queue-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .queue-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .queue-title h2 {
      margin: 0;
      font-size: 22px;
    }

    .count {
      color: #666;
      font-size: 15px;
    }

    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0;
      border-top: 1px solid #eee;
    }

    .person-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ticket {
      font-size: 22px;
      font-weight: bold;
      min-width: 78px;
    }

    .status {
      font-size: 15px;
      color: #555;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 35px 0;
    }

    .error {
      color: #b00020;
      padding: 20px 0;
    }

    #callNextButton {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #1f1f1f;
      color: white;
    }

    #callNextButton:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .complete-button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #1f1f1f;
      color: white;
    }

    .complete-button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="dashboard">

      <div class="header">
        <div class="logo">🔔</div>
        <h1>TurnCue</h1>
        <div class="subtitle">Business Dashboard</div>
      </div>

      <div class="session-bar">
        <div id="sessionStatus" class="session-status">
          Setting up TurnCue...
        </div>

        <div id="sessionDetail" class="session-detail">
          Please wait.
        </div>
      </div>

      <div class="queue-card">

        <div class="queue-title">
          <h2>Waiting</h2>
          <div id="waitingCount" class="count">0 waiting</div>
        </div>

        <button id="callNextButton" disabled>
          CALL NEXT
        </button>

        <div id="waitingList">
          <div class="empty">Loading queue...</div>
        </div>

      </div>

      <div class="queue-card">

        <div class="queue-title">
          <h2>Called</h2>
          <div id="calledCount" class="count">0 called</div>
        </div>

        <div id="calledList">
          <div class="empty">Loading...</div>
        </div>

      </div>

    </div>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      query,
      where,
      orderBy,
      onSnapshot,
      updateDoc,
      serverTimestamp,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCngq4CXYVHXBqr_zipMgIqPiDWxzlpIVM",
      authDomain: "turncue-83e1a.firebaseapp.com",
      projectId: "turncue-83e1a",
      storageBucket: "turncue-83e1a.firebasestorage.app",
      messagingSenderId: "459437201769",
      appId: "1:459437201769:web:1859490f3db0f3fc2945f8"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    /*
      DEVELOPMENT IDs

      These are intentionally simple for Batch 1.
      Later, TurnCue setup will create real businesses,
      locations and queues.
    */

    const BUSINESS_ID = "demo-business";
    const LOCATION_ID = "main-location";
    const QUEUE_ID = "main-queue";


    const sessionStatus =
      document.getElementById("sessionStatus");

    const sessionDetail =
      document.getElementById("sessionDetail");

    const waitingList =
      document.getElementById("waitingList");

    const waitingCount =
      document.getElementById("waitingCount");

    const calledList =
      document.getElementById("calledList");

    const calledCount =
      document.getElementById("calledCount");

    const callNextButton =
      document.getElementById("callNextButton");


    let currentSessionId = null;
    let waitingCustomers = [];

    let unsubscribeWaiting = null;
    let unsubscribeCalled = null;


    async function initializeTurnCue() {

      try {

        sessionStatus.textContent =
          "Setting up TurnCue...";

        const businessRef =
          doc(db, "businesses", BUSINESS_ID);

        const locationRef =
          doc(db, "locations", LOCATION_ID);

        const queueRef =
          doc(db, "queues", QUEUE_ID);


        /*
          Create the permanent development records if
          they do not exist yet.
        */

        const businessSnapshot =
          await getDoc(businessRef);

        if (!businessSnapshot.exists()) {

          await setDoc(
            businessRef,
            {
              name: "TurnCue Demo Business",
              active: true,
              createdAt: serverTimestamp()
            }
          );
        }


        const locationSnapshot =
          await getDoc(locationRef);

        if (!locationSnapshot.exists()) {

          await setDoc(
            locationRef,
            {
              businessId: BUSINESS_ID,
              name: "Main Location",
              active: true,
              createdAt: serverTimestamp()
            }
          );
        }


        const queueSnapshot =
          await getDoc(queueRef);


        if (!queueSnapshot.exists()) {

          await setDoc(
            queueRef,
            {
              businessId: BUSINESS_ID,
              locationId: LOCATION_ID,
              name: "Main Queue",
              active: true,
              currentSessionId: null,
              ticketPrefix: "A",
              ticketStart: 101,
              createdAt: serverTimestamp()
            }
          );
        }


        /*
          Re-read the queue because it may have just
          been created.
        */

        const freshQueueSnapshot =
          await getDoc(queueRef);

        const queueData =
          freshQueueSnapshot.data();


        if (queueData.currentSessionId) {

          const existingSessionRef =
            doc(
              db,
              "sessions",
              queueData.currentSessionId
            );

          const existingSessionSnapshot =
            await getDoc(existingSessionRef);


          if (
            existingSessionSnapshot.exists() &&
            existingSessionSnapshot.data().status === "open"
          ) {

            currentSessionId =
              existingSessionSnapshot.id;

          } else {

            await createNewSession(queueRef);
          }

        } else {

          await createNewSession(queueRef);
        }


        sessionStatus.textContent =
          "Queue is open";

        sessionDetail.textContent =
          "Operational session: " +
          currentSessionId;


        startQueueListeners();

      } catch (error) {

        console.error(
          "TurnCue initialization error:",
          error
        );

        sessionStatus.textContent =
          "Unable to initialize TurnCue";

        sessionDetail.textContent =
          error.message;

        waitingList.innerHTML =
          '<div class="error">Unable to load the queue.</div>';

        calledList.innerHTML =
          '<div class="error">Unable to load called customers.</div>';
      }
    }


    async function createNewSession(queueRef) {

      const sessionRef =
        doc(collection(db, "sessions"));


      await setDoc(
        sessionRef,
        {
          businessId: BUSINESS_ID,
          locationId: LOCATION_ID,
          queueId: QUEUE_ID,

          status: "open",

          ticketPrefix: "A",
          nextTicketNumber: 101,

          openedAt: serverTimestamp(),
          closedAt: null
        }
      );


      await updateDoc(
        queueRef,
        {
          currentSessionId: sessionRef.id
        }
      );


      currentSessionId =
        sessionRef.id;
    }


    function startQueueListeners() {

      if (!currentSessionId) {
        return;
      }


      if (unsubscribeWaiting) {
        unsubscribeWaiting();
      }

      if (unsubscribeCalled) {
        unsubscribeCalled();
      }


      const entriesRef =
        collection(
          db,
          "sessions",
          currentSessionId,
          "entries"
        );


      const waitingQuery = query(
        entriesRef,
        where("status", "==", "waiting"),
        orderBy("joinedAt", "asc")
      );


      const calledQuery = query(
        entriesRef,
        where("status", "==", "called"),
        orderBy("calledAt", "asc")
      );


      unsubscribeWaiting =
        onSnapshot(

          waitingQuery,

          (snapshot) => {

            waitingCustomers =
              snapshot.docs;

            waitingList.innerHTML = "";

            waitingCount.textContent =
              snapshot.size + " waiting";

            callNextButton.disabled =
              snapshot.empty;


            if (snapshot.empty) {

              waitingList.innerHTML =
                '<div class="empty">No one is waiting.</div>';

              return;
            }


            snapshot.docs.forEach(
              (customer, index) => {

                const data =
                  customer.data();


                const item =
                  document.createElement("div");

                item.className =
                  "queue-item";


                const personInfo =
                  document.createElement("div");

                personInfo.className =
                  "person-info";


                const ticket =
                  document.createElement("div");

                ticket.className =
                  "ticket";

                ticket.textContent =
                  data.ticketLabel ||
                  "#" + (index + 1);


                const status =
                  document.createElement("div");

                status.className =
                  "status";

                status.textContent =
                  "Position " + (index + 1);


                personInfo.appendChild(ticket);
                personInfo.appendChild(status);

                item.appendChild(personInfo);

                waitingList.appendChild(item);
              }
            );
          },

          (error) => {

            console.error(
              "Waiting queue error:",
              error
            );

            waitingList.innerHTML =
              '<div class="error">Unable to load waiting queue.</div>';
          }
        );


      unsubscribeCalled =
        onSnapshot(

          calledQuery,

          (snapshot) => {

            calledList.innerHTML = "";

            calledCount.textContent =
              snapshot.size + " called";


            if (snapshot.empty) {

              calledList.innerHTML =
                '<div class="empty">No one has been called.</div>';

              return;
            }


            snapshot.docs.forEach(
              (customer) => {

                const data =
                  customer.data();


                const item =
                  document.createElement("div");

                item.className =
                  "queue-item";


                const personInfo =
                  document.createElement("div");

                personInfo.className =
                  "person-info";


                const ticket =
                  document.createElement("div");

                ticket.className =
                  "ticket";

                ticket.textContent =
                  data.ticketLabel ||
                  "Ticket";


                const status =
                  document.createElement("div");

                status.className =
                  "status";

                status.textContent =
                  "It's their turn";


                const completeButton =
                  document.createElement("button");

                completeButton.className =
                  "complete-button";

                completeButton.textContent =
                  "COMPLETE";


                completeButton.addEventListener(
                  "click",
                  async () => {

                    completeButton.disabled =
                      true;

                    try {

                      await updateDoc(
                        customer.ref,
                        {
                          status: "completed",
                          completedAt:
                            serverTimestamp()
                        }
                      );

                    } catch (error) {

                      console.error(
                        "Complete error:",
                        error
                      );

                      completeButton.disabled =
                        false;
                    }
                  }
                );


                personInfo.appendChild(ticket);
                personInfo.appendChild(status);

                item.appendChild(personInfo);
                item.appendChild(
                  completeButton
                );

                calledList.appendChild(item);
              }
            );
          },

          (error) => {

            console.error(
              "Called queue error:",
              error
            );

            calledList.innerHTML =
              '<div class="error">Unable to load called customers.</div>';
          }
        );
    }


    /*
      CALL NEXT uses a Firestore transaction.

      This matters later when multiple windows exist.
      Batch 1 still has one business dashboard, but
      we're already avoiding the old simple update.
    */

    callNextButton.addEventListener(
      "click",
      async () => {

        if (
          !currentSessionId ||
          waitingCustomers.length === 0
        ) {
          return;
        }


        callNextButton.disabled = true;


        try {

          const firstCustomerRef =
            waitingCustomers[0].ref;


          await runTransaction(
            db,
            async (transaction) => {

              const customerSnapshot =
                await transaction.get(
                  firstCustomerRef
                );


              if (!customerSnapshot.exists()) {

                throw new Error(
                  "Customer no longer exists."
                );
              }


              const customerData =
                customerSnapshot.data();


              if (
                customerData.status !==
                "waiting"
              ) {

                throw new Error(
                  "Customer is no longer waiting."
                );
              }


              transaction.update(
                firstCustomerRef,
                {
                  status: "called",
                  calledAt:
                    serverTimestamp()
                }
              );
            }
          );

        } catch (error) {

          console.error(
            "Call next error:",
            error
          );

          callNextButton.disabled = false;
        }
      }
    );


    initializeTurnCue();

  </script>

</body>
</html>
